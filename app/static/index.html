<!DOCTYPE html>
<html lang="en">
<head>

  <title>Partners Bus Prediction - College Bus Tracking & ETA</title>
  
  <!-- Modern App Stylesheet -->
  <link rel="stylesheet" href="/static/css/app.css">

  <!-- Free Open-Source Map Engine: Leaflet.js (₹0 / OpenStreetMap) -->

      <p style="color: var(--neutral-500); font-size: 1.1rem;">Initializing Partners Bus Prediction system...</p>
